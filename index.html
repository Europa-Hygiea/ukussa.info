<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="avatar/avatar1.jpg" alt="Profile Picture" class="profile-image">
            <h1 class="name"></h1> <!-- Random name will be inserted here -->
            <p class="bio"></p> <!-- Random bio will be inserted here -->
            <center><p class="age-location"></p></center> <!-- Age and location will be inserted here -->
        </div>
        <div class="links">
            <a href="" class="link-button pulse">
                <i class="fa-brands fa-whatsapp"></i> <span>WhatsApp Number</span>
            </a>
            <a href="123" class="link-button">
                <i class="fa-solid fa-phone-volume"></i> <span>IMO Number</span>
            </a>
            <a href="" class="link-button"> 
                <i class="fa-solid fa-video"></i> <span>Video Call</span>
            </a>
            <a href="" class="link-button blink">
                <i class="fa-solid fa-street-view"></i> <span>Booking Meetup</span>
            </a>
        </div>
        
        <div class="social-icons">
            <a href="#" class="icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fab fa-telegram-plane"></i></a>
            <a href="#" class="icon"><i class="fas fa-video"></i></a>
        </div>
    </div>

    <script>
        // Fetch data from a text file and return it as an array
        async function fetchData(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                const data = text.split('\n').map(line => line.trim()).filter(line => line);
                console.log(`Fetched data from ${filePath}:`, data); // Log the fetched data
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                return []; // Return empty array on error
            }
        }

        // Get a random item from an array
        function getRandomItem(array) {
            if (array.length === 0) return ''; // Return empty string if array is empty
            return array[Math.floor(Math.random() * array.length)];
        }

        // Function to set random content
        async function setRandomContent() {
            // Random avatar image
            const avatarImages = [
                'avatar1.jpg', 'avatar2.jpg', 'avatar3.jpg', 'avatar4.jpg', 
                'avatar5.jpg', 'avatar6.jpg', 'avatar7.jpg', 'avatar8.jpg', 
                'avatar9.jpg', 'avatar10.jpg', 'avatar11.jpg', 'avatar12.jpg', 
                'avatar13.jpg', 'avatar14.jpg', 'avatar15.jpg', 'avatar16.jpg', 
                'avatar17.jpg', 'avatar18.jpg', 'avatar19.jpg', 'avatar20.jpg', 
                'avatar21.jpg', 'avatar22.jpg', 'avatar23.jpg', 'avatar24.jpg', 
                'avatar25.jpg', 'avatar26.jpg', 'avatar27.jpg', 'avatar28.jpg', 
                'avatar29.jpg', 'avatar30.jpg', 'avatar31.jpg', 'avatar32.jpg', 
                'avatar33.jpg', 'avatar34.jpg', 'avatar35.jpg', 'avatar36.jpg', 
                'avatar37.jpg', 'avatar38.jpg', 'avatar39.jpg', 'avatar40.jpg'
            ];
            document.querySelector('.profile-image').src = `avatar/${getRandomItem(avatarImages)}`;

            // Random name and bio
            const names = await fetchData('names.txt');
            const bios = await fetchData('bio.txt');
            const ages = await fetchData('age.txt');
            const locations = await fetchData('location.txt');

            document.querySelector('.name').textContent = getRandomItem(names) || 'No name available';
            document.querySelector('.bio').textContent = getRandomItem(bios) || 'No bio available';

            // Random Age and Location
            const randomAge = getRandomItem(ages) || 'Unknown Age';
            const randomLocation = getRandomItem(locations) || 'Unknown Location';
            document.querySelector('.age-location').textContent = `${randomAge}, ${randomLocation}`;

            // Random links
            const links = await fetchData('links.txt');
            document.querySelectorAll('.link-button').forEach(link => {
                link.href = getRandomItem(links); // Assign a random link to each button
            });
        }

        // Run the function on load
        document.addEventListener('DOMContentLoaded', setRandomContent);
    </script>
</body>
</html>
